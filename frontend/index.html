<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Guitar Tab Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f17;
      --surface: #1a1a2e;
      --surface2: #22223b;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-light: #a78bfa;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #2d2d4a;
      --success: #10b981;
      --error: #ef4444;
      --tab-bg: #0d1117;
      --tab-text: #7ee787;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-light), #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p { color: var(--text-muted); margin-top: 0.5rem; font-size: 0.95rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      width: 100%;
      max-width: 740px;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-row { display: flex; gap: 0.75rem; }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 0.65rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--text-muted); }

    .options-row {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .option-group { display: flex; flex-direction: column; gap: 0.4rem; }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      padding: 0.5rem 0.75rem;
      outline: none;
      cursor: pointer;
    }

    select:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.65rem 1.4rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status-box {
      display: none;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1.25rem;
      padding: 0.9rem 1.1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
    }

    #status-box.visible { display: flex; }

    .spinner {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 2px solid var(--border);
      border-top-color: var(--accent-light);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #status-icon { font-size: 1.1rem; }
    #status-msg { font-size: 0.88rem; color: var(--text-muted); }

    .hint {
      font-size: 0.77rem;
      color: var(--text-muted);
      margin-top: 1rem;
      line-height: 1.6;
    }

    #output-card { display: none; }
    #output-card.visible { display: block; }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .output-header h2 { font-size: 0.95rem; font-weight: 600; }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 0.35rem 0.85rem;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) { background: var(--border); }

    pre#tab-output {
      background: var(--tab-bg);
      color: var(--tab-text);
      font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
      font-size: 0.78rem;
      line-height: 1.7;
      padding: 1.25rem;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre;
      border: 1px solid #1e2737;
      max-height: 65vh;
      overflow-y: auto;
    }

    footer {
      margin-top: auto;
      padding-top: 2rem;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>🎸 AI Guitar Tab Generator</h1>
  <p>Paste a YouTube URL — get AI-generated guitar tabs</p>
</header>

<div class="card">
  <label for="yt-url">YouTube URL</label>
  <div class="input-row">
    <input
      type="text"
      id="yt-url"
      placeholder="https://www.youtube.com/watch?v=..."
      autocomplete="off"
      spellcheck="false"
    />
    <button id="gen-btn" onclick="generate()">Generate</button>
  </div>

  <div class="options-row">
    <div class="option-group">
      <label for="duration">Analyze first</label>
      <select id="duration">
        <option value="30">30 seconds</option>
        <option value="60" selected>1 minute</option>
        <option value="120">2 minutes</option>
        <option value="300">5 minutes (slow)</option>
      </select>
    </div>
  </div>

  <div id="status-box">
    <div class="spinner" id="spinner"></div>
    <span id="status-icon" style="display:none"></span>
    <span id="status-msg">Starting...</span>
  </div>

  <p class="hint">
    Uses Spotify's <strong>basic-pitch</strong> AI — handles both single-note
    lines and chords. Processing takes roughly 30–90 seconds.
  </p>
</div>

<div class="card" id="output-card">
  <div class="output-header">
    <h2>Guitar Tab</h2>
    <button class="btn-secondary" onclick="copyTab()">Copy</button>
  </div>
  <pre id="tab-output"></pre>
</div>

<footer>Powered by basic-pitch &middot; yt-dlp &middot; FastAPI &middot; runs 100% on your machine</footer>

<script>
  let pollTimer = null;

  async function generate() {
    const url = document.getElementById('yt-url').value.trim();
    if (!url) { alert('Paste a YouTube URL first.'); return; }

    const duration = parseInt(document.getElementById('duration').value, 10);
    const btn = document.getElementById('gen-btn');
    btn.disabled = true;
    document.getElementById('output-card').classList.remove('visible');
    document.getElementById('tab-output').textContent = '';
    setStatus('processing', 'Submitting job...');

    try {
      const res = await fetch('/api/transcribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ youtube_url: url, max_duration: duration }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `Server error ${res.status}`);
      startPolling(data.job_id);
    } catch (err) {
      setStatus('error', err.message);
      btn.disabled = false;
    }
  }

  function startPolling(jobId) {
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch(`/api/status/${jobId}`);
        const data = await res.json();

        if (data.message) setStatus('processing', data.message);

        if (data.status === 'done') {
          clearInterval(pollTimer);
          setStatus('done', 'Tabs generated!');
          showTabs(data.tabs);
          document.getElementById('gen-btn').disabled = false;
        } else if (data.status === 'error') {
          clearInterval(pollTimer);
          setStatus('error', data.error || 'Something went wrong.');
          document.getElementById('gen-btn').disabled = false;
        }
      } catch (_) { /* network blip — keep polling */ }
    }, 2000);
  }

  function setStatus(type, msg) {
    const box  = document.getElementById('status-box');
    const spin = document.getElementById('spinner');
    const icon = document.getElementById('status-icon');
    const text = document.getElementById('status-msg');

    box.classList.add('visible');
    text.textContent = msg;

    if (type === 'processing') {
      spin.style.display = 'block'; icon.style.display = 'none';
      text.style.color = 'var(--text-muted)';
    } else if (type === 'done') {
      spin.style.display = 'none'; icon.style.display = 'block';
      icon.textContent = '✅'; text.style.color = 'var(--success)';
    } else {
      spin.style.display = 'none'; icon.style.display = 'block';
      icon.textContent = '❌'; text.style.color = 'var(--error)';
    }
  }

  function showTabs(tabs) {
    document.getElementById('tab-output').textContent = tabs;
    document.getElementById('output-card').classList.add('visible');
    document.getElementById('output-card').scrollIntoView({ behavior: 'smooth' });
  }

  function copyTab() {
    navigator.clipboard.writeText(document.getElementById('tab-output').textContent)
      .then(() => {
        const btn = document.querySelector('.btn-secondary');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 2000);
      });
  }

  document.getElementById('yt-url').addEventListener('keydown', e => {
    if (e.key === 'Enter') generate();
  });
</script>

</body>
</html>
